<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="remoteMac">
  <meta name="theme-color" content="#0a0a0c">
  <title>remoteMac</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Pairing. Shown until this device holds a session token. -->
  <section id="pair-screen" class="fullscreen hidden">
    <div class="card">
      <div class="card-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="4.5" y="3" width="10.5" height="16" rx="2.8"/>
          <path d="M8 6h3.5"/>
          <path d="M12 11 L19.5 17 L16 17.3 L17.8 20.5 L15.6 21.4 L13.9 18.1 L11.7 20.2 Z"
                fill="currentColor" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Pair this phone</h1>
      <p>Enter the 6-digit PIN from the Mac's menu bar.</p>
      <input id="pair-pin" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             autocomplete="off" placeholder="••••••" aria-label="Pairing PIN">
      <button id="pair-submit">Connect</button>
      <div id="pair-error" class="err" role="alert"></div>
    </div>
  </section>

  <!-- Connection lost. Blocks input so nothing is sent into the void. -->
  <section id="offline-screen" class="fullscreen hidden">
    <div class="card">
      <div class="card-mark warn" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round">
          <path d="M2 8.5a16 16 0 0 1 20 0"/>
          <path d="M5.5 12.5a11 11 0 0 1 13 0"/>
          <path d="M9 16.5a6 6 0 0 1 6 0"/>
          <circle cx="12" cy="20.5" r="1.1" fill="currentColor"/>
          <path d="M3 3 L21 21" stroke-width="2"/>
        </svg>
      </div>
      <h1>Disconnected</h1>
      <p id="offline-detail">Reconnecting…</p>
      <button id="offline-retry">Retry now</button>
    </div>
  </section>

  <header id="bar">
    <div id="status" class="status">
      <span id="dot" class="dot" aria-hidden="true"></span>
      <span id="status-text">Connecting</span>
    </div>
    <h1 id="view-title">Trackpad</h1>
    <button id="settings-btn" class="gear" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.6 1.6 0 0 0 .33 1.76l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.76-.33 1.6 1.6 0 0 0-1 1.46V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9.1 19.4a1.6 1.6 0 0 0-1.76.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .33-1.76 1.6 1.6 0 0 0-1.46-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9.1a1.6 1.6 0 0 0-.33-1.76l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.6 1.6 0 0 0 1.76.33H9a1.6 1.6 0 0 0 1-1.46V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.46 1.6 1.6 0 0 0 1.76-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.33 1.76V9a1.6 1.6 0 0 0 1.46 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/>
      </svg>
    </button>
  </header>

  <main>
    <!-- Trackpad (portrait default) -->
    <section id="view-trackpad" class="view">
      <div id="trackpad" aria-label="Trackpad">
        <!-- Follows the finger, so the surface reacts instead of sitting dead. -->
        <span id="pad-glow" aria-hidden="true"></span>
        <!-- Shows which modifiers are held, so a sticky ⌘ affecting
             clicks is visible rather than a surprise. -->
        <span id="mod-badge" aria-live="polite"></span>
        <span id="pad-hint">Drag to move · tap to click · two fingers to scroll</span>
      </div>
      <div class="pad-row">
        <button id="click-left" class="padbtn">Left</button>
        <button id="click-right" class="padbtn">Right</button>
      </div>
      <!-- There were Desktop ◀ ▶ buttons here. macOS does not act on a
           synthesized Space-switch shortcut, so they did nothing at all — see
           the note on SystemAction in Sources/Protocol.swift. -->
      <div class="pad-row small">
        <button class="padbtn ghost" data-action="mission_control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="4" width="7.5" height="7" rx="1.6"/>
            <rect x="13.5" y="4" width="7.5" height="7" rx="1.6"/>
            <rect x="3" y="13.5" width="7.5" height="7" rx="1.6"/>
            <rect x="13.5" y="13.5" width="7.5" height="7" rx="1.6"/>
          </svg>Mission Control</button>
      </div>
    </section>

    <!-- Shortcuts -->
    <section id="view-shortcuts" class="view">
      <div class="deck-head">
        <div id="folder-tabs" class="folder-tabs"></div>
        <button id="deck-edit" class="deck-edit">Edit</button>
      </div>
      <div id="deck-toolbar" class="deck-toolbar"></div>
      <div id="deck-pages" class="deck-pages"></div>
      <div id="page-dots" class="page-dots"></div>
      <span id="deck-hint" class="deck-hint">Tap to run · hold to edit</span>
    </section>

    <!-- Keyboard (shown automatically in landscape) -->
    <section id="view-keyboard" class="view">
      <div class="kb-mods" id="kb-mods">
        <button class="modchip" data-mod="command">⌘</button>
        <button class="modchip" data-mod="control">⌃</button>
        <button class="modchip" data-mod="shift">⇧</button>
        <button class="modchip" data-mod="option">⌥</button>
        <span class="kb-modtip">Held modifiers apply to the next key</span>
      </div>
      <div class="kb-special" id="kb-special">
        <button class="sp" data-key="53">esc</button>
        <button class="sp" data-key="48">⇥</button>
        <button class="sp" data-key="51">⌫</button>
        <button class="sp" data-key="36">return</button>
        <button class="sp" data-key="123">←</button>
        <button class="sp" data-key="126">↑</button>
        <button class="sp" data-key="125">↓</button>
        <button class="sp" data-key="124">→</button>
      </div>
      <textarea id="kb-input" placeholder="Tap here to type on the Mac"
                autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                enterkeyhint="send"></textarea>
      <div class="kb-foot">
        <span id="kb-hint">Goes to the focused app on the Mac</span>
        <button id="kb-clear">Clear</button>
        <!-- iOS gives no way out of a focused textarea on its own, so the
             software keyboard would cover the modifier and arrow rows with no
             way to get them back. -->
        <button id="kb-hide">Hide ⌄</button>
      </div>
    </section>
  </main>

  <!-- Navigation lives at the bottom: it is the only part of a phone screen a
       thumb reaches comfortably. Horizontal swipes here also change view, so
       the trackpad's one-finger swipe can stay pointer movement. -->
  <nav id="switcher" aria-label="View">
    <span id="tab-indicator" aria-hidden="true"></span>
    <button class="tab" data-view="shortcuts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="2"/>
        <rect x="14" y="3" width="7" height="7" rx="2"/>
        <rect x="3" y="14" width="7" height="7" rx="2"/>
        <rect x="14" y="14" width="7" height="7" rx="2"/>
      </svg>
      <span>Shortcuts</span>
    </button>
    <button class="tab" data-view="trackpad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3.5" width="18" height="17" rx="3.4"/>
        <path d="M10 8.6 L16.2 13.6 L13.4 13.9 L14.9 16.7 L13 17.5 L11.6 14.6 L9.7 16.4 Z"
              fill="currentColor" stroke="none"/>
      </svg>
      <span>Trackpad</span>
    </button>
    <button class="tab" data-view="keyboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" aria-hidden="true">
        <rect x="2" y="5.5" width="20" height="13" rx="2.6"/>
        <path d="M6 9.5h.01M9.5 9.5h.01M13 9.5h.01M16.5 9.5h.01M6 12.8h.01M9.5 12.8h.01M13 12.8h.01M16.5 12.8h.01"
              stroke-width="2.1"/>
        <path d="M7.5 15.6h9"/>
      </svg>
      <span>Keys</span>
    </button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <!-- Order matters: logic.js is pure and depends on nothing, deck.js uses it,
       app.js wires deck.js to the connection. -->
  <script src="/logic.js"></script>
  <script src="/deck.js"></script>
  <script src="/app.js"></script>
</body>
</html>
